name: Regenerar sitio

on:
  schedule:
    # 11:00 UTC = 6:00 a. m. en Bogotá (UTC-5)
    - cron: "0 11 * * *"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerar-sitio
  cancel-in-progress: false

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas
        run: python3 -I -m unittest discover -s tests -v

      - name: Regenerar index.html y sitemap.xml
        if: github.event_name != 'pull_request'
        run: python3 scripts/generar_archivo.py

      - name: Guardar cambios si los hay
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- index.html sitemap.xml; then
            echo "Sin cambios: index.html y sitemap.xml ya coinciden con data/."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml
          git commit -m "Regenera portada, archivo y sitemap desde data/"
          git push
